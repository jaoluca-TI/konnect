<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="shortcut icon" href="/img/konnect.png" type="image/x-icon">
    <link rel="stylesheet" href="/konnect/frontend/css/login.css">
</head>
<body>
    <div class="container">
        <div class="areaLogin">
            <h1>konnect</h1>
            <form action="" class="form">
                <div class="input-box">
                    <input type="text" placeholder="E-mail">
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Senha">
                </div>
                <div class="esqueceu-senha">
                    <a href="">Esqueceu sua senha?</a>
                </div>
                <div class="botao">
                    <a href="/frontend/html/home.html"><button type="submit">Entrar</button></a>
                </div>
                <div class="cadastrar">
                    <p>Ainda não tem uma conta?</p>
                    <a href="cadastro.html">Cadastre-se</a>
                </div>
                <div class="voltar">
                    <a href="/frontend/html/home.html">Voltar para o início</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
